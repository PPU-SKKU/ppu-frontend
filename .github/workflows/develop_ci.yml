name: CI for develop PR

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run ESLint
        run: npm run lint:ci
      - name: Run Prettier
        run: npx prettier --check .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      - name: Build Android Debug
        run: cd android && ./gradlew assembleDebug

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci
      - uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: '1.16.2'
      - name: Install Pods
        run: cd ios && pod install

      - name: List available simulator runtimes
        run: |
          echo "=== Installed iOS Simulator Runtimes ==="
          xcrun simctl list runtimes | grep -i "iOS"
          echo "=== End runtimes ==="

      - name: Detect available iOS simulator
        id: detect-sim
        run: |
          echo "=== Listing available iOS simulators ==="
          xcrun simctl list devices available

          # 설치된 최신 시뮬레이터 SDK 가져오기
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Using latest available SDK: $SDK"

          # 실제 사용 가능한 디바이스 중 첫 번째 선택
          AVAILABLE_DEVICE=$(xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" | head -n 1)
          echo "Available device line: '$AVAILABLE_DEVICE'"

          if [ -n "$AVAILABLE_DEVICE" ]; then
            # 모든 괄호 제거 후 앞뒤 공백 제거
            DEVICE_NAME=$(echo "$AVAILABLE_DEVICE" | sed -E 's/^[[:space:]]*//; s/ \([^)]+\)$//')
            DEST="platform=iOS Simulator,name=$DEVICE_NAME,OS=$SDK"
            echo "Using device: $DEVICE_NAME with OS: $SDK"
          else
            echo "No available devices found, using fallback"
            DEST="platform=iOS Simulator,name=iPhone 14,OS=$SDK"
          fi

          echo "Final selected simulator: $DEST"
          echo "DEST=$DEST" >> $GITHUB_ENV

      - name: Build iOS Debug
        run: |
          cd ios && xcodebuild \
            -workspace ppu_frontend.xcworkspace \
            -scheme ppu_frontend \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  discord-notify:
    runs-on: ubuntu-latest
    needs: [lint-and-prettier, android-build, ios-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "📢 새로운 PR이 열렸어요!\n'"$PR_URL"'"}' \
            $DISCORD_WEBHOOK
