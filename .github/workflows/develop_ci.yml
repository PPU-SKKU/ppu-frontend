name: CI for develop PR

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run ESLint
        run: npm run lint:ci
      - name: Run Prettier
        run: npx prettier --check .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      - name: Build Android Debug
        run: cd android && ./gradlew assembleDebug

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci
      - uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: '1.16.2'
      - name: Install Pods
        run: cd ios && pod install
      - name: Detect available iOS simulator
        id: detect-sim
        run: |
          echo "=== Listing available iOS simulators ==="
          xcrun simctl list devices available

          # 설치된 iOS SDK 중 가장 최신 버전 확인
          SDK=$(xcrun simctl list runtimes | grep "iOS" | grep -v "unavailable" | awk '{print $2}' | sort -V | tail -n 1)
          echo "Using latest available SDK: $SDK"

          # 디버깅: SDK와 매칭되는 디바이스들 확인
          echo "=== Devices matching SDK $SDK ==="
          xcrun simctl list devices available | grep "iPhone" | grep "$SDK" || echo "No devices found for SDK $SDK"
          echo "=== End matching devices ==="

          # 사용 가능한 디바이스 중 첫 번째 iPhone 선택
          DEST=$(xcrun simctl list devices available | grep "iPhone" | grep "$SDK" | head -n 1 | awk -F '[()]' '{gsub(/^ +| +$/,"",$2); gsub(/^ +| +$/,"",$4); print "platform=iOS Simulator,name="$2",OS="$4}')

          echo "Initial DEST result: '$DEST'"

          if [ -z "$DEST" ]; then
            echo "No suitable simulator found, trying any iPhone with any iOS version..."
            # 아무 iPhone이나 찾기 (OS 버전 무관)
            DEST=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | awk -F '[()]' '{gsub(/^ +| +$/,"",$2); gsub(/^ +| +$/,"",$4); print "platform=iOS Simulator,name="$2",OS="$4}')
            echo "Found any iPhone: '$DEST'"
            
            if [ -z "$DEST" ]; then
              echo "Still no device found, fallback to default iPhone 14 + $SDK"
              DEST="platform=iOS Simulator,name=iPhone 14,OS=$SDK"
            fi
          fi

          echo "Final selected simulator: $DEST"
          echo "DEST=$DEST" >> $GITHUB_ENV

      - name: Build iOS Debug
        run: |
          cd ios && xcodebuild \
            -workspace ppu_frontend.xcworkspace \
            -scheme ppu_frontend \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ env.DEST }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  discord-notify:
    runs-on: ubuntu-latest
    needs: [lint-and-prettier, android-build, ios-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "📢 새로운 PR이 열렸어요!\n'"$PR_URL"'"}' \
            $DISCORD_WEBHOOK
