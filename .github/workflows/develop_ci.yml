name: CI for develop PR

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run ESLint
        run: npm run lint:ci
      - name: Run Prettier
        run: npx prettier --check .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      - name: Build Android Debug
        run: cd android && ./gradlew assembleDebug

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci
      - uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: '1.16.2'
      - name: Install Pods
        run: cd ios && pod install

      - name: Show installed SDKs
        run: xcodebuild -showsdks

      - name: List available simulator runtimes
        run: |
          echo "=== Installed iOS Simulator Runtimes ==="
          xcrun simctl list runtimes | grep -i "iOS"
          echo "=== End runtimes ==="

      - name: List installed iOS Simulator devices
        shell: bash
        run: |
          echo "=== Installed iOS Simulator Devices ==="
          xcrun simctl list devices | grep -i "iPhone"
          echo "=== End devices ==="

      - name: Build iOS Debug
        shell: bash
        run: |
          echo "=== Detect Available iOS Simulator ==="

          # 가장 최신 iOS 런타임 버전 가져오기 (unavailable 제외)
          OS_VERSION=$(xcrun simctl list runtimes | \
            grep "iOS" | grep -v "unavailable" | \
            awk -F '[()]' '{print $2}' | sort -V | tail -n 1)

          # 해당 OS 버전의 첫 번째 iPhone 기기명 가져오기
          DEVICE_NAME=$(xcrun simctl list devices available | \
            grep "iPhone" | grep "$OS_VERSION" | \
            head -n 1 | awk -F '[()]' '{print $1}' | sed 's/^[[:space:]]*//')

          echo "Using simulator device: $DEVICE_NAME ($OS_VERSION)"

          # iOS SDK 버전 추출
          SDK_VERSION=$(xcodebuild -showsdks | \
            grep "iphonesimulator" | head -n 1 | \
            sed 's/.*iphonesimulator//')

          echo "Using SDK version: $SDK_VERSION"

          cd ios && xcodebuild \
            -workspace ppu_frontend.xcworkspace \
            -scheme ppu_frontend \
            -configuration Debug \
            -sdk iphonesimulator${SDK_VERSION} \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME},OS=${OS_VERSION}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  discord-notify:
    runs-on: ubuntu-latest
    needs: [lint-and-prettier, android-build, ios-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "📢 새로운 PR이 열렸어요!\n'"$PR_URL"'"}' \
            $DISCORD_WEBHOOK
