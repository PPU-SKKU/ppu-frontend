name: CI for develop PR

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run ESLint
        run: npm run lint:ci
      - name: Run Prettier
        run: npx prettier --check .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      - name: Build Android Debug
        run: cd android && ./gradlew assembleDebug

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci
      - uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: '1.16.2'
      - name: Install Pods
        run: cd ios && pod install

      - name: Show installed SDKs
        run: xcodebuild -showsdks

      - name: List available simulator runtimes
        run: |
          echo "=== Installed iOS Simulator Runtimes ==="
          xcrun simctl list runtimes | grep -i "iOS"
          echo "=== End runtimes ==="

      - name: List installed iOS Simulator devices
        shell: bash
        run: |
          echo "=== Installed iOS Simulator Devices ==="
          xcrun simctl list devices | grep -i "iPhone"
          echo "=== End devices ==="

      - name: Build iOS Debug
        shell: bash
        run: |
          echo "=== Available iOS Simulator Devices ==="
          # 설치된 시뮬레이터 기기 중 사용 가능한 것만 추출
          DEVICE_INFO=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1)
          DEVICE_NAME=$(echo "$DEVICE_INFO" | awk -F '[()]' '{print $2}')
          echo "Using simulator device: $DEVICE_NAME"

          echo "=== Installed iOS Simulator SDKs ==="
          # 설치된 iOS 시뮬레이터 SDK 확인
          SDK_VERSION=$(xcodebuild -showsdks \
            | grep "iphonesimulator" \
            | head -n 1 \
            | awk '{print $NF}' \
            | sed 's/.*iphonesimulator//')

          echo "Using SDK version: $SDK_VERSION"

          # iOS 빌드 실행
          cd ios && xcodebuild \
            -workspace ppu_frontend.xcworkspace \
            -scheme ppu_frontend \
            -configuration Debug \
            -sdk iphonesimulator${SDK_VERSION} \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME},OS=${SDK_VERSION}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  discord-notify:
    runs-on: ubuntu-latest
    needs: [lint-and-prettier, android-build, ios-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "📢 새로운 PR이 열렸어요!\n'"$PR_URL"'"}' \
            $DISCORD_WEBHOOK
